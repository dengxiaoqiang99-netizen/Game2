<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>联机五子棋</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#222;color:#fff;font-family:system-ui;text-align:center;padding:10px;}
.container{max-width:460px;margin:0 auto;}
#hall{margin-top:30px;}
#hallTip{font-size:20px;color:#ffdd44;margin:10px 0;}
#startBtn{display:none;margin:15px auto;font-size:18px;padding:10px 30px;}
#game{display:none;}
#myRole{font-size:16px;color:#ffd066;margin:4px 0;}
#status{font-size:18px;margin:6px 0;color:#8cf;min-height:24px;}
#countdown{font-size:20px;color:#ff6666;font-weight:bold;margin:4px 0;}
canvas{background:#deb870;border-radius:6px;margin:6px auto;touch-action:none;}
#chatBox{width:100%;height:120px;background:#333;text-align:left;padding:8px;overflow-y:auto;border-radius:6px;margin:8px 0;font-size:14px;}
.btn-group{margin:6px 0;}
button{padding:8px 10px;font-size:14px;border:none;border-radius:8px;background:#e6b349;color:#111;margin:3px;}
button:disabled{background:#666;color:#aaa;}
#chatInput{width:calc(100% - 90px);padding:8px;}
#sendChatBtn{width:80px;padding:8px;}
</style>
</head>
<body>
<div class="container">
<h1>🎮 联机五子棋</h1>

<div id="hall">
<div id="hallTip">正在等待对手进入...</div>
<button id="startBtn">准备开始</button>
</div>

<div id="game">
<div id="myRole"></div>
<div id="status">等待对局开始...</div>
<div id="countdown"></div>
<canvas id="board"></canvas>
<div class="btn-group">
<button id="restartBtn">重新开局</button>
<button id="undoBtn">请求悔棋</button>
</div>
<div class="btn-group">
<button class="quickChat">行不行啊！</button>
<button class="quickChat">单挑啊！</button>
<button class="quickChat">我赢了！</button>
</div>
<div id="chatBox"></div>
<div style="display:flex;gap:6px;">
<input id="chatInput" placeholder="输入消息">
<button id="sendChatBtn">发送</button>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, update, onValue, get, runTransaction, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDEuVLSVMc9sAgfeZeNHwR88FAaBW0yEpY",
  authDomain: "game-eed02.firebaseapp.com",
  databaseURL: "https://game-eed02-default-rtdb.firebaseio.com",
  projectId: "game-eed02",
  storageBucket: "game-eed02.firebasestorage.app",
  messagingSenderId: "817508526856",
  appId: "1:817508526856:web:5df14ea809f18c3ad41abd",
  measurementId: "G-ZQRTLDL7Z6"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const SIZE = 15;
const CELL = 26;
const PADDING = 14;
const TIME_LIMIT = 20;
let playerIndex = 0; // 1=玩家1 2=玩家2
let myChess = null; // black / white
let roomRef = ref(db,"global/room");
let board = Array(SIZE).fill().map(()=>Array(SIZE).fill(0));
let turn = 1;
let gameOver = false;
let turnStartTime = Date.now();
let countdownTimer = null;
let lastBoard = null;
let chatList = [];

const hallDom = document.getElementById("hall");
const hallTip = document.getElementById("hallTip");
const startBtn = document.getElementById("startBtn");
const gameDom = document.getElementById("game");
const myRoleText = document.getElementById("myRole");
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");
const countdownText = document.getElementById("countdown");
const chatBox = document.getElementById("chatBox");
const chatInput = document.getElementById("chatInput");
const sendChatBtn = document.getElementById("sendChatBtn");
const undoBtn = document.getElementById("undoBtn");
const restartBtn = document.getElementById("restartBtn");
const quickBtns = document.querySelectorAll(".quickChat");

canvas.width = PADDING*2 + CELL*(SIZE-1);
canvas.height = PADDING*2 + CELL*(SIZE-1);

// 快捷聊天
quickBtns.forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(!myChess) return;
    const text = btn.innerText;
    const name = myChess === "black" ? "【黑棋】" : "【白棋】";
    get(roomRef).then(snap=>{
      const data = snap.val();
      let chats = data.chats || [];
      chats.push(`${name}${text}`);
      if(chats.length>50) chats.shift();
      update(roomRef,{chats:chats});
    });
  });
});

function drawAll(){
  ctx.fillStyle = "#deb870";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="#333";
  ctx.lineWidth=1;
  for(let i=0;i<SIZE;i++){
    ctx.beginPath();
    ctx.moveTo(PADDING, PADDING+i*CELL);
    ctx.lineTo(PADDING+(SIZE-1)*CELL, PADDING+i*CELL);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(PADDING+i*CELL, PADDING);
    ctx.lineTo(PADDING+i*CELL, PADDING+(SIZE-1)*CELL);
    ctx.stroke();
  }
  for(let y=0;y<SIZE;y++){
    for(let x=0;x<SIZE;x++){
      const p = board[y][x];
      if(!p) continue;
      const cx = PADDING + x*CELL;
      const cy = PADDING + y*CELL;
      ctx.beginPath();
function checkWin(x,y,player){
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for(let [dx,dy] of dirs){
    let cnt=1;
    for(let i=1;i<5;i++){
      const nx=x+dx*i; const ny=y+dy*i;
      if(nx>=0&&nx<SIZE&&ny>=0&&ny<SIZE&&board[ny][nx]===player) cnt++;
      else break;
    }
    for(let i=1;i<5;i++){
      const nx=x-dx*i; const ny=y-dy*i;
      if(nx>=0&&nx<SIZE&&ny>=0&&ny<SIZE&&board[ny][nx]===player) cnt++;
      else break;
    }
    if(cnt>=5) return true;
  }
  return false;
}

function startCountdown(){
  clearInterval(countdownTimer);
  turnStartTime = Date.now();
  countdownTimer = setInterval(()=>{
    const passed = Math.floor((Date.now() - turnStartTime)/1000);
    const remain = TIME_LIMIT - passed;
    if(remain <= 0){
      clearInterval(countdownTimer);
      if(!gameOver){
        const nextTurn = turn === 1 ? 2 : 1;
        update(roomRef,{
          turn: nextTurn,
          turnStart: Date.now()
        });
        countdownText.innerText="⏱ 超时！自动切换回合";
      }
      return;
    }
    countdownText.innerText=`⏱ 剩余 ${remain} 秒落子`;
  }, 500);
}

// 落子（兼容触屏+鼠标点击）
function handleMove(e){
  e.preventDefault();
  if(gameOver || !myChess) return;
  const rect = canvas.getBoundingClientRect();
  let mx, my;
  if(e.touches && e.touches[0]){
    mx = e.touches[0].clientX - rect.left;
    my = e.touches[0].clientY - rect.top;
  }else if(e.changedTouches && e.changedTouches[0]){
    mx = e.changedTouches[0].clientX - rect.left;
    my = e.changedTouches[0].clientY - rect.top;
  }else{
    mx = e.clientX - rect.left;
    my = e.clientY - rect.top;
  }
  const x = Math.round((mx-PADDING)/CELL);
  const y = Math.round((my-PADDING)/CELL);
  if(x<0||x>=SIZE||y<0||y>=SIZE) return;
  if(board[y][x]!==0) return;
  
  const mySideNum = myChess==="black"?1:2;
  if(turn !== mySideNum){
    statusText.innerText="不是你的回合！";
    return;
  }
  lastBoard = JSON.parse(JSON.stringify(board));
  board[y][x] = mySideNum;
  const win = checkWin(x,y,mySideNum);
  const nextTurn = turn===1 ? 2 :1;
  update(roomRef,{
    board:board,
    turn:nextTurn,
    turnStart: Date.now(),
    over:win,
    winner: win ? mySideNum : 0,
    lastBoard: lastBoard
  });
}
canvas.addEventListener("touchend",handleMove);
canvas.addEventListener("click",handleMove);

function renderChat(){
  chatBox.innerHTML = chatList.map(item=>`<div>${item}</div>`).join("");
  chatBox.scrollTop = chatBox.scrollHeight;
}

sendChatBtn.addEventListener("click",()=>{
  const text = chatInput.value.trim();
  if(!text || !myChess) return;
  const name = myChess === "black" ? "【黑棋】" : "【白棋】";
  get(roomRef).then(snap=>{
    const data = snap.val();
    let chats = data.chats || [];
    chats.push(`${name}${text}`);
    if(chats.length>50) chats.shift();
    update(roomRef,{chats:chats});
  });
  chatInput.value="";
});

undoBtn.addEventListener("click",async ()=>{
  const snap = await get(roomRef);
  const data = snap.val();
  if(!data.lastBoard){
    alert("暂无步骤可以悔棋");
    return;
  }
  if(confirm("向对手发起悔棋请求？")){
    const name = myChess === "black" ? "【黑棋】" : "【白棋】";
    get(roomRef).then(s=>{
      const d = s.val();
      let chats = d.chats||[];
      chats.push(`${name} 请求悔棋，请对手确认！`);
      update(roomRef,{chats});
    });
  }
});

// 原子加入房间（修复版事务）
async function joinRoom(){
  try{
    const res = await runTransaction(roomRef, room=>{
      if(!room){
        room = {
          p1:false, p2:false,
          ready1:false, ready2:false,
          gameStart:false,
          chess1:"", chess2:"",
          board:Array(SIZE).fill().map(()=>Array(SIZE).fill(0)),
          turn:1, turnStart:Date.now(),
          over:false, winner:0,
          chats:[], lastBoard:null
        };
      }
      if(!room.p1){
        room.p1 = true;
        playerIndex = 1;
      }else if(!room.p2){
        room.p2 = true;
        playerIndex = 2;
      }else{
        return; // 房间满
      }
      return room;
    });
    
    if(!res.committed){
      alert("房间已满，请刷新等待！");
      location.reload();
      return;
    }
    
    // 设置断线自动离开
    const field = playerIndex===1 ? "p1" : "p2";
    onDisconnect(roomRef.child(field)).set(false);
    
  }catch(err){
    console.error("加入房间失败",err);
    alert("连接失败，请刷新重试");
  }
}

// 点击准备
startBtn.addEventListener("click",async ()=>{
  if(playerIndex===0) return;
  const key = playerIndex===1 ? "ready1" : "ready2";
  await update(roomRef,{[key]:true});
});
function listenRoom(){
  onValue(roomRef, async snap=>{
    const data = snap.val();
    if(!data) return;
    
    board = data.board || [];
    turn = data.turn || 1;
    gameOver = data.over || false;
    chatList = data.chats || [];
    renderChat();
    drawAll();

    // 有人退出 → 重置回大厅
    if(!data.p1 || !data.p2){
      clearInterval(countdownTimer);
      countdownText.innerText="";
      hallDom.style.display="block";
      gameDom.style.display="none";
      startBtn.style.display="none";
      hallTip.innerText="等待对手进入房间...";
      myChess = null;
      return;
    }

    // 两人都在，显示准备按钮
    hallDom.style.display="block";
    gameDom.style.display="none";
    startBtn.style.display="block";
    
    const meReady = playerIndex===1 ? data.ready1 : data.ready2;
    const otherReady = playerIndex===1 ? data.ready2 : data.ready1;
    
    if(meReady && otherReady){
      hallTip.innerText="双方已准备，对局即将开始...";
      startBtn.style.display="none";
    }else if(meReady){
      hallTip.innerText="你已准备，等待对手准备...";
      startBtn.disabled = true;
    }else{
      hallTip.innerText="两名玩家已就位，点击准备开始";
      startBtn.disabled = false;
    }

    // 双方都准备 + 还没开局 → 随机分配黑白，启动对局
    if(data.ready1 && data.ready2 && !data.gameStart){
      const rand = Math.random() > 0.5;
      await update(roomRef,{
        gameStart:true,
        chess1: rand ? "black" : "white",
        chess2: rand ? "white" : "black"
      });
      return;
    }

    // 正式对局
    if(data.gameStart){
      hallDom.style.display="none";
      gameDom.style.display="block";
      
      myChess = playerIndex===1 ? data.chess1 : data.chess2;
      myRoleText.innerText = `你执：${myChess==="black"?"黑棋⚫":"白棋⚪"}`;

      if(gameOver){
        clearInterval(countdownTimer);
        countdownText.innerText="";
        statusText.innerText = data.winner===1 ? "🏆 黑棋胜利！" : "🏆 白棋胜利！";
      }else{
        statusText.innerText = turn===1 ? "当前：黑棋落子" : "当前：白棋落子";
        turnStartTime = data.turnStart;
        startCountdown();
      }
    }
  });
}

restartBtn.addEventListener("click",async ()=>{
  clearInterval(countdownTimer);
  await update(roomRef,{
    ready1:false, ready2:false, gameStart:false,
    chess1:"", chess2:"",
    board:Array(SIZE).fill().map(()=>Array(SIZE).fill(0)),
    turn:1, turnStart:Date.now(),
    over:false, winner:0,
    chats:[], lastBoard:null
  });
});

// 启动
async function init(){
  await joinRoom();
  listenRoom();
}

init();
drawAll();
</script>
</body>
</html>
