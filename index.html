<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>联机五子棋</title>
<style>
body{background:#222;color:#fff;text-align:center;font-family:sans-serif}
button{padding:8px 15px;margin:5px;border-radius:8px}
canvas{background:#deb870;touch-action:none}
#game{display:none}
#chat{height:100px;overflow:auto;background:#333;text-align:left}
</style>
</head>
<body>
<h2>🎮 联机五子棋</h2>
<div id="hall">
<p id="tip">正在连接...</p>
<button id="share">复制房间链接</button>
<button id="ready">准备</button>
</div>
<div id="game">
<p id="role"></p>
<p id="status"></p>
<p id="time"></p>
<canvas id="board" width="404" height="404"></canvas>
<div id="chat"></div>
<input id="msg"><button id="send">发送</button>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,set,get,update,onValue}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyDEuVLSVMc9sAgfeNHwR88FAaBW0yEpY",
authDomain:"game-eed02.firebaseapp.com",
databaseURL:"https://game-eed02-default-rtdb.firebaseio.com",
projectId:"game-eed02",
storageBucket:"game-eed02.firebasestorage.app",
messagingSenderId:"817508526856",
appId:"1:817508526856:web:5df14ea809f18c3ad41abd"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

let roomId=new URLSearchParams(location.search).get("room");
let player=0;
let color=0;
let board=Array.from({length:15},()=>Array(15).fill(0));
let turn=1;

const tip=document.getElementById("tip");
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");

async function initRoom(){
 if(!roomId){
   roomId=Math.random().toString(36).slice(2,8);
   player=1;
   await set(ref(db,"rooms/"+roomId),{
    p1:true,p2:false,
    ready1:false,ready2:false,
    start:false,
    board,
    turn:1
   });
   history.replaceState(null,"","?room="+roomId);
 }else{
   let s=await get(ref(db,"rooms/"+roomId));
   let r=s.val();
   if(!r.p2){
    player=2;
    await update(ref(db,"rooms/"+roomId),{p2:true});
   }
 }
 tip.innerText="房间："+roomId+"  玩家"+player;
}

document.getElementById("share").onclick=()=>{
 navigator.clipboard.writeText(location.href);
 alert("链接已复制");
};

document.getElementById("ready").onclick=async()=>{
 await update(ref(db,"rooms/"+roomId),
 player==1?{ready1:true}:{ready2:true});
};

function draw(){
 ctx.fillStyle="#deb870";
 ctx.fillRect(0,0,404,404);
 for(let i=0;i<15;i++){
  ctx.beginPath();
  ctx.moveTo(14+i*26,14);
  ctx.lineTo(14+i*26,378);
  ctx.moveTo(14,14+i*26);
  ctx.lineTo(378,14+i*26);
  ctx.stroke();
 }
 for(let y=0;y<15;y++)for(let x=0;x<15;x++){
  if(board[y][x]){
   ctx.beginPath();
   ctx.arc(14+x*26,14+y*26,11,0,7);
   ctx.fillStyle=board[y][x]==1?"black":"white";
   ctx.fill();
  }
 }
}

canvas.onclick=async e=>{
 if(player==0)return;
 let x=Math.round((e.offsetX-14)/26);
 let y=Math.round((e.offsetY-14)/26);
 if(board[y]?.[x])return;
 let s=await get(ref(db,"rooms/"+roomId));
 let r=s.val();
 if(r.turn!=color)return;
 board[y][x]=color;
 await update(ref(db,"rooms/"+roomId),{
  board,turn:color==1?2:1
 });
};

onValue(ref(db,"rooms/"+roomId),s=>{
 let r=s.val();
 if(!r)return;
 board=r.board||board;
 turn=r.turn;
 if(r.ready1&&r.ready2&&!r.start){
  update(ref(db,"rooms/"+roomId),{
   start:true,
   color1:Math.random()>0.5?1:2,
   color2:Math.random()>0.5?2:1
  });
 }
 if(r.start){
  document.getElementById("hall").style.display="none";
  document.getElementById("game").style.display="block";
  color=player==1?r.color1:r.color2;
  document.getElementById("role").innerText="你的棋子："+(color==1?"黑":"白");
 }
 draw();
});

initRoom();
</script>
</body>
</html>
