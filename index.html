<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>联机五子棋</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#222;color:#fff;font-family:system-ui;text-align:center;padding:10px;}
.container{max-width:460px;margin:0 auto;}
#matchTip{font-size:20px;color:#ffdd44;margin:20px 0;}
#game{display:none;}
#status{font-size:18px;margin:6px 0;color:#8cf;min-height:24px;}
#countdown{font-size:20px;color:#ff6666;font-weight:bold;margin:4px 0;}
canvas{background:#deb870;border-radius:6px;margin:6px auto;touch-action:none;}
#chatBox{width:100%;height:120px;background:#333;text-align:left;padding:8px;overflow-y:auto;border-radius:6px;margin:8px 0;font-size:14px;}
.btn-group{margin:6px 0;}
button{padding:8px 10px;font-size:14px;border:none;border-radius:8px;background:#e6b349;color:#111;margin:3px;}
button:disabled{background:#666;color:#aaa;}
#chatInput{width:calc(100% - 90px);padding:8px;}
#sendChatBtn{width:80px;padding:8px;}
</style>
</head>
<body>
<div class="container">
<h1>🎮 联机五子棋</h1>
<div id="matchTip">正在匹配对手，请稍候...</div>

<div id="game">
<div id="status">等待数据加载...</div>
<div id="countdown"></div>
<canvas id="board"></canvas>
<div class="btn-group">
<button id="restartBtn">重新开局</button>
<button id="undoBtn">请求悔棋</button>
</div>
<div class="btn-group">
<button class="quickChat">行不行啊！</button>
<button class="quickChat">单挑啊！</button>
<button class="quickChat">我赢了！</button>
</div>
<div id="chatBox"></div>
<div style="display:flex;gap:6px;">
<input id="chatInput" placeholder="输入消息">
<button id="sendChatBtn">发送</button>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, update, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDEuVLSVMc9sAgfeZeNHwR88FAaBW0yEpY",
  authDomain: "game-eed02.firebaseapp.com",
  databaseURL: "https://game-eed02-default-rtdb.firebaseio.com",
  projectId: "game-eed02",
  storageBucket: "game-eed02.firebasestorage.app",
  messagingSenderId: "817508526856",
  appId: "1:817508526856:web:5df14ea809f18c3ad41abd",
  measurementId: "G-ZQRTLDL7Z6"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const SIZE = 15;
const CELL = 26;
const PADDING = 14;
const TIME_LIMIT = 20;
let role = null;
let gameRef = ref(db,"global/room");
let board = Array(SIZE).fill().map(()=>Array(SIZE).fill(0));
let turn = 1;
let gameOver = false;
let turnStartTime = Date.now();
let countdownTimer = null;
let lastBoard = null;
let chatList = [];

const matchTip = document.getElementById("matchTip");
const gameDom = document.getElementById("game");
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");
const countdownText = document.getElementById("countdown");
const chatBox = document.getElementById("chatBox");
const chatInput = document.getElementById("chatInput");
const sendChatBtn = document.getElementById("sendChatBtn");
const undoBtn = document.getElementById("undoBtn");
const restartBtn = document.getElementById("restartBtn");
const quickBtns = document.querySelectorAll(".quickChat");
canvas.width = PADDING*2 + CELL*(SIZE-1);
canvas.height = PADDING*2 + CELL*(SIZE-1);

quickBtns.forEach(btn=>{
  btn.onclick = ()=>{
    const text = btn.innerText;
    const name = role === "black" ? "【黑棋】" : "【白棋】";
    get(gameRef).then(snap=>{
      const data = snap.val();
      let chats = data.chats || [];
      chats.push(`${name}${text}`);
      if(chats.length>50) chats.shift();
      update(gameRef,{chats:chats});
    });
  }
});

function drawAll(){
  ctx.fillStyle = "#deb870";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="#333";
  ctx.lineWidth=1;
  for(let i=0;i<SIZE;i++){
    ctx.beginPath();
    ctx.moveTo(PADDING, PADDING+i*CELL);
    ctx.lineTo(PADDING+(SIZE-1)*CELL, PADDING+i*CELL);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(PADDING+i*CELL, PADDING);
    ctx.lineTo(PADDING+i*CELL, PADDING+(SIZE-1)*CELL);
    ctx.stroke();
  }
  for(let y=0;y<SIZE;y++){
    for(let x=0;x<SIZE;x++){
      const p = board[y][x];
      if(!p) continue;
      const cx = PADDING + x*CELL;
      const cy = PADDING + y*CELL;
      ctx.beginPath();
      ctx.arc(cx,cy,CELL*0.42,0,Math.PI*2);
      if(p===1){
        ctx.fillStyle="#000";
      }else{
        ctx.fillStyle="#fff";
        ctx.strokeStyle="#777";
        ctx.stroke();
      }
      ctx.fill();
    }
  }
}
function checkWin(x,y,player){
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for(let [dx,dy] of dirs){
    let cnt=1;
    for(let i=1;i<5;i++){
      const nx=x+dx*i; const ny=y+dy*i;
      if(nx>=0&&nx<SIZE&&ny>=0&&ny<SIZE&&board[ny][nx]===player) cnt++;
      else break;
    }
    for(let i=1;i<5;i++){
      const nx=x-dx*i; const ny=y-dy*i;
      if(nx>=0&&nx<SIZE&&ny>=0&&ny<SIZE&&board[ny][nx]===player) cnt++;
      else break;
    }
    if(cnt>=5) return true;
  }
  return false;
}

function startCountdown(){
  clearInterval(countdownTimer);
  turnStartTime = Date.now();
  countdownTimer = setInterval(()=>{
    const passed = Math.floor((Date.now() - turnStartTime)/1000);
    const remain = TIME_LIMIT - passed;
    if(remain <= 0){
      clearInterval(countdownTimer);
      if(!gameOver){
        const nextTurn = turn === 1 ? 2 : 1;
        update(gameRef,{
          turn: nextTurn,
          turnStart: Date.now()
        });
        countdownText.innerText="⏱ 超时！自动切换回合";
      }
      return;
    }
    countdownText.innerText=`⏱ 剩余 ${remain} 秒落子`;
  }, 500);
}

canvas.addEventListener("touchend",e=>{
  e.preventDefault();
  if(gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const touch = e.changedTouches[0];
  const mx = touch.clientX - rect.left;
  const my = touch.clientY - rect.top;
  const x = Math.round((mx-PADDING)/CELL);
  const y = Math.round((my-PADDING)/CELL);
  if(x<0||x>=SIZE||y<0||y>=SIZE) return;
  if(board[y][x]!==0) return;
  const mySide = role==="black"?1:2;
  if(turn !== mySide){
    statusText.innerText="不是你的回合！";
    return;
  }
  lastBoard = JSON.parse(JSON.stringify(board));
  board[y][x] = mySide;
  const win = checkWin(x,y,mySide);
  const nextTurn = turn===1 ? 2 :1;
  update(gameRef,{
    board:board,
    turn:nextTurn,
    turnStart: Date.now(),
    over:win,
    winner: win ? mySide : 0,
    lastBoard: lastBoard
  });
});

function renderChat(){
  chatBox.innerHTML = chatList.map(item=>`<div>${item}</div>`).join("");
  chatBox.scrollTop = chatBox.scrollHeight;
}

sendChatBtn.onclick = ()=>{
  const text = chatInput.value.trim();
  if(!text) return;
  const name = role === "black" ? "【黑棋】" : "【白棋】";
  get(gameRef).then(snap=>{
    const data = snap.val();
    let chats = data.chats || [];
    chats.push(`${name}${text}`);
    if(chats.length>50) chats.shift();
    update(gameRef,{chats:chats});
  });
  chatInput.value="";
};

undoBtn.onclick = async ()=>{
  const snap = await get(gameRef);
  const data = snap.val();
  if(!data.lastBoard){
    alert("暂无步骤可以悔棋");
    return;
  }
  if(confirm("向对手发起悔棋请求？")){
    const name = role === "black" ? "【黑棋】" : "【白棋】";
    get(gameRef).then(s=>{
      const d = s.val();
      let chats = d.chats||[];
      chats.push(`${name} 请求悔棋，请对手确认！`);
      update(gameRef,{chats});
    });
  }
};

// 初始化房间，没人则创建空房间
async function initRoom(){
  const snap = await get(gameRef);
  let data = snap.val();
  if(!data){
    await set(gameRef,{
      player1:null,player2:null,
      board:Array(SIZE).fill().map(()=>Array(SIZE).fill(0)),
      turn:1,turnStart:Date.now(),over:false,winner:0,chats:[],lastBoard:null
    });
  }
  joinGame();
}

async function joinGame(){
  const snap = await get(gameRef);
  const data = snap.val();
  if(!data.player1){
    role = "black";
    await update(gameRef,{player1:"black"});
  }else if(!data.player2){
    role = "white";
    await update(gameRef,{player2:"white"});
  }else{
    alert("对局已满，请稍后刷新重试！");
    location.reload();
  }
}
function listenRoom(){
  onValue(gameRef,snap=>{
    const data = snap.val();
    if(!data) {
      location.reload();
      return;
    }
    board = data.board;
    turn = data.turn;
    gameOver = data.over;
    chatList = data.chats || [];
    renderChat();
    drawAll();

    // 任意一方离开，重置对局
    if(!data.player1 || !data.player2){
      clearInterval(countdownTimer);
      countdownText.innerText="";
      matchTip.style.display="block";
      gameDom.style.display="none";
      matchTip.innerText="对手已退出，等待新玩家加入...";
      return;
    }

    // 双方齐全，进入对局界面
    matchTip.style.display="none";
    gameDom.style.display="block";

    if(gameOver){
      clearInterval(countdownTimer);
      countdownText.innerText="";
      if(data.winner===1) statusText.innerText="🏆 黑棋胜利！";
      else statusText.innerText="🏆 白棋胜利！";
    }else{
      statusText.innerText="对局准备开始";
      turnStartTime = data.turnStart;
      startCountdown();
      if(turn===1) statusText.innerText="当前：黑棋落子";
      else statusText.innerText="当前：白棋落子";
    }
  });
}

restartBtn.onclick = async ()=>{
  clearInterval(countdownTimer);
  await set(gameRef,{
    player1:"black",player2:"white",
    board:Array(SIZE).fill().map(()=>Array(SIZE).fill(0)),
    turn:1,turnStart:Date.now(),over:false,winner:0,chats:[],lastBoard:null
  });
};

window.addEventListener("beforeunload",async ()=>{
  if(role==="black") update(gameRef,{player1:null});
  if(role==="white") update(gameRef,{player2:null});
});

document.addEventListener("visibilitychange",async ()=>{
  if(document.hidden) return;
});

initRoom();
listenRoom();
drawAll();
</script>
</body>
</html>
